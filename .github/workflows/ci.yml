name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      jour:
        description: "Date de parution BODACC a traiter (AAAA-MM-JJ)"
        required: false
        default: ""

# Droits minimaux : ce workflow ne fait que lire le depot et deposer un artefact.
permissions:
  contents: read

env:
  # Parution de reference des chiffres publies. Le BODACC parait du mardi au
  # samedi ; cette date est un mardi, et les archives d'un jour passe ne bougent
  # plus, ce qui rend le run reproductible.
  JOUR_DEFAUT: "2026-09-22"

jobs:
  qualite-code:
    name: style et tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check src tests dags scripts
      - name: "pytest, sans Airflow : les tests du graphe sont sautes ici"
        run: |
          mkdir -p results
          uv run pytest -q 2>&1 | tee results/pytest.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-unitaires
          path: results/pytest.txt

  terraform:
    name: infrastructure decrite en code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: format et validation (sans compte AWS, donc sans apply)
        working-directory: infra/terraform
        run: |
          set -o pipefail
          mkdir -p ../../results
          # pipefail sinon le code de sortie de terraform fmt est masque par tee
          # et le controle de format ne bloquerait rien.
          terraform fmt -check -recursive -diff | tee ../../results/terraform_fmt.txt
          terraform init -backend=false
          terraform validate -no-color | tee ../../results/terraform_validate.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terraform
          path: results/terraform_*.txt

  graphe:
    name: execution du graphe Airflow sur LocalStack
    # Ce workflow est public : aucun identifiant AWS reel n'y circule, et aucun
    # secret de depot n'est configure. Il tourne donc contre LocalStack, ce qui
    # suffit a prouver ce qu'il doit prouver : que le graphe Airflow se charge,
    # s'execute de bout en bout, bloque quand un controle echoue et se rejoue
    # sans doubler. Les chiffres publies, eux, viennent d'une execution sur le
    # vrai compartiment S3, lancee depuis le poste (voir le README).
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      # Memoire desserree : le runner en a plus que le poste de 8 Go.
      AIRFLOW_MEM_LIMIT: 2500m
      POSTGRES_MEM_LIMIT: 1g
      LOCALSTACK_MEM_LIMIT: 1500m
      AIRFLOW_ADMIN_PASSWORD: mot-de-passe-ci
      POSTGRES_PASSWORD: postgres-ci
      # Cible S3 : LocalStack. Ces identifiants ne valent que pour l'emulateur.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: eu-north-1
      AWS_DEFAULT_REGION: eu-north-1
      RADAR_BUCKET: amzn-s3-seau
      RADAR_PREFIXE: radar
      RADAR_DEPARTEMENT: "34"
      RADAR_MOTEUR: duckdb
      # Jours de parution rejoues pour remplir la fenetre glissante. Le BODACC
      # parait du mardi au samedi : les dimanches et lundis sont absents.
      # Trois parutions suffisent ici : le 16 septembre est celle que les
      # controles de qualite doivent refuser, les deux autres doivent passer.
      # La fenetre glissante complete est produite par l'execution sur le vrai
      # compte AWS, decrite dans le README.
      JOURS_HISTORIQUE: "2026-09-16 2026-09-17 2026-09-18"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Choisir la date de parution traitee
        id: date
        run: |
          jour="${{ github.event.inputs.jour }}"
          [ -z "$jour" ] && jour="${JOUR_DEFAUT}"
          echo "jour=$jour" >> "$GITHUB_OUTPUT"
          echo "Parution traitee : $jour"

      - name: Monter la pile (Airflow, PostgreSQL, LocalStack)
        run: docker compose up -d --build

      - name: Attendre que la pile soit prete
        run: |
          set -e
          for _ in $(seq 1 60); do
            etat=$(docker compose ps --format '{{.Service}} {{.State}} {{.Health}}')
            echo "$etat"
            if echo "$etat" | grep -q 'localstack running healthy' \
               && echo "$etat" | grep -q 'postgres running healthy' \
               && echo "$etat" | grep -q 'airflow-webserver running healthy'; then
              break
            fi
            sleep 10
          done
          # airflow-init est un service a execution unique : on exige son code 0.
          code=$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -aq airflow-init)")
          docker compose logs airflow-init | tail -30
          test "$code" = "0"

      - name: Le graphe se charge sans erreur d'import
        run: |
          mkdir -p results
          docker compose run --rm airflow-cli airflow dags list 2>&1 | tee results/airflow_dags_list.txt
          docker compose run --rm airflow-cli airflow dags list-import-errors 2>&1 | tee results/airflow_import_errors.txt
          ! grep -qi "radar_entreprises_herault" results/airflow_import_errors.txt

      - name: Structure du graphe
        run: docker compose run --rm airflow-cli airflow tasks list radar_entreprises_herault --tree 2>&1 | tee results/airflow_tasks_tree.txt

      - name: Tests du graphe, la ou Airflow existe reellement
        run: |
          docker compose run --rm airflow-cli \
            python -m pytest /opt/airflow/tests/test_sql_et_dag.py -q 2>&1 | tee results/pytest_airflow.txt

      - name: Execution du graphe de bout en bout sur une date donnee
        run: |
          set -o pipefail
          debut=$(date +%s)
          docker compose run --rm airflow-cli \
            airflow dags test radar_entreprises_herault ${{ steps.date.outputs.jour }} 2>&1 \
            | tee results/airflow_dags_test.txt
          fin=$(date +%s)
          echo "{\"jour\": \"${{ steps.date.outputs.jour }}\", \"duree_graphe_s\": $((fin - debut))}" \
            > results/duree_graphe.json
          cat results/duree_graphe.json

      - name: Le graphe echoue bien quand un controle de qualite echoue
        # Preuve que les controles sont reellement bloquants : quatre situations
        # anormales forcees, chacune doit lever et arreter le graphe.
        run: |
          set -o pipefail
          docker compose run --rm airflow-cli             python /opt/airflow/scripts/preuve_blocage.py 2>&1 | tee results/preuve_blocage.txt

      - name: Deuxieme execution, pour prouver le rejeu idempotent
        run: |
          set -o pipefail
          docker compose run --rm airflow-cli             airflow dags test radar_entreprises_herault ${{ steps.date.outputs.jour }} 2>&1             | tee results/airflow_dags_test_rejeu.txt

      - name: Rejeu des autres jours de parution, pour la fenetre glissante
        # Volontairement tolerant : un jour peut echouer sur un controle de
        # qualite, et c'est precisement ce que l'on veut voir. Le resultat de
        # chaque jour est enregistre, reussite comme echec.
        run: |
          echo "[" > results/rejeu_historique.json
          premier=1
          for jour in $JOURS_HISTORIQUE; do
            echo "::group::parution $jour"
            debut=$(date +%s)
            if docker compose run --rm airflow-cli                  airflow dags test radar_entreprises_herault "$jour" > "results/dag_$jour.log" 2>&1; then
              etat="reussi"
            else
              etat="bloque"
            fi
            fin=$(date +%s)
            # Les journaux d'Airflow pesent lourd : on ne garde que la fin utile.
            tail -200 "results/dag_$jour.log" > "results/dag_$jour.tail" && mv "results/dag_$jour.tail" "results/dag_$jour.log"
            tail -25 "results/dag_$jour.log"
            echo "-> $jour : $etat en $((fin - debut)) s"
            echo "::endgroup::"
            [ $premier -eq 0 ] && echo "," >> results/rejeu_historique.json
            premier=0
            printf '  {"jour": "%s", "etat": "%s", "duree_s": %d}' "$jour" "$etat" "$((fin - debut))"               >> results/rejeu_historique.json
          done
          echo "" >> results/rejeu_historique.json
          echo "]" >> results/rejeu_historique.json
          cat results/rejeu_historique.json

      - name: Motif de blocage des jours refuses
        run: |
          for fichier in results/dag_*.log; do
            if grep -q "QualiteError" "$fichier"; then
              echo "=== $fichier"
              grep -m1 -A2 "QualiteError" "$fichier"
            fi
          done | tee results/motifs_blocage.txt
          echo "(vide signifie : aucun jour bloque)"

      - name: Contenu du seau S3 emule
        run: |
          docker compose exec -T localstack \
            awslocal s3 ls "s3://${RADAR_BUCKET}/${RADAR_PREFIXE}/" --recursive --summarize \
            2>&1 | tee results/s3_contenu.txt

      - name: Exporter les chiffres publies et tracer les figures
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
        run: |
          uv sync --frozen
          uv run python scripts/export_results.py --jour ${{ steps.date.outputs.jour }}
          uv run python scripts/figures.py --jour ${{ steps.date.outputs.jour }}

      - name: Etat des conteneurs
        run: docker compose ps | tee results/docker_compose_ps.txt

      - name: Chiffres cles du run
        run: |
          echo "=== volumetrie.json"       && cat results/volumetrie.json
          echo "=== synthese.json"         && cat results/synthese.json
          echo "=== requetes_entrepot.json" && cat results/requetes_entrepot.json
          echo "=== controles de qualite"  && column -s, -t < results/controles_qualite.csv

      - name: Journaux en cas d'echec
        if: failure()
        run: docker compose logs --tail 150

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultats-localstack
          path: results/

      - name: Arret propre
        if: always()
        run: docker compose down -v
