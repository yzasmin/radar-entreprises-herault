[project]
name = "radar-entreprises-herault"
version = "0.1.0"
description = "Radar economique de l'Herault : BODACC et SIRENE orchestres par Airflow, stockes en Parquet sur S3, interroges par Athena ou DuckDB"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Bornes hautes partout : une version majeure ne doit pas entrer sans avoir ete testee.
dependencies = [
    "boto3>=1.35,<2",
    "pyarrow>=17,<22",
    "requests>=2.32,<3",
    "duckdb>=1.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "moto[s3]>=5.0,<6",
    "ruff>=0.6,<0.13",
    "matplotlib>=3.9,<4",
]

[project.scripts]
radar = "radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["infra"]

# Regles fixees explicitement pour que la CI et le poste local donnent le meme verdict.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
